name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libasound2-dev \
            libssl-dev \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa \
            file

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          save-if: false

      - name: Set version from the tag
        shell: bash
        run: bash .github/scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build and bundle
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
          CXXFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64
        run: bun run tauri build --target ${{ matrix.target }} --config '{"build":{"beforeBuildCommand":"bun run build:web:release"}}'

      - name: Collect bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p "upload/${TARGET}"
          cd "src-tauri/target/${TARGET}/release/bundle"
          if [ -d nsis ]; then cp nsis/*.exe "../../../upload/${TARGET}/"; fi
          if [ -d msi ]; then cp msi/*.msi "../../../upload/${TARGET}/"; fi
          if [ -d appimage ]; then cp appimage/*.AppImage "../../../upload/${TARGET}/"; fi
          if [ -d deb ]; then cp deb/*.deb "../../../upload/${TARGET}/"; fi
          if [ -d rpm ]; then cp rpm/*.rpm "../../../upload/${TARGET}/"; fi
          cd ../../../upload/${TARGET}
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          retention-days: 5
          if-no-files-found: error
          path: upload/${{ matrix.target }}

  release:
    name: GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          notes="notes-${TAG}.md"
          {
            echo 'Загрузка Мелонии: установщик под свою платформу из списка ниже.'
            echo
            echo '- Windows: *-setup.exe (установка для текущего пользователя)'
            echo '- Linux: .AppImage (запуск без установки), .deb и .rpm'
            echo '- Рядом с каждым файлом — его .sha256'
            echo
            echo 'Первая версия форка: интерфейс Мелонии, обновления идут релизами этого репозитория.'
          } > "$notes"
          gh release view "$TAG" >/dev/null 2>&1 && \
            gh release edit "$TAG" --latest --title "Мелония ${TAG#v}" --notes-file "$notes" || \
            gh release create "$TAG" --verify-tag --latest --title "Мелония ${TAG#v}" --notes-file "$notes"
          shopt -s nullglob
          files=(artifacts/*)
          gh release upload "$TAG" "${files[@]}" --clobber
